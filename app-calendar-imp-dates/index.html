<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Family Circles Calendar Sandbox</title>
    <style>
        :root {
    --bg-main: #f0f7f4;
    --card-bg: #ffffff;
    --text-main: #2d3748;
    --primary: #ff6b6b;
    --secondary: #4ecdc4;
    --accent: #ffe66d;
    --elderly-view: #6c5ce7;
    --border-radius: 24px;
    --font-size-base: 18px;
    --grid-gap: 15px;
    --min-box-height: 100px;
}

/* Grandparent Mode Adaptive Overrides */
[data-theme="elderly"] {
    --bg-main: #fffdf6;
    --text-main: #1a1a1a;
    --font-size-base: 24px;
    --border-radius: 32px;
    --grid-gap: 25px;
    --min-box-height: 150px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-size: var(--font-size-base);
    padding: 20px;
    transition: all 0.2s ease-in-out;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    padding: 20px 40px;
    border-radius: var(--border-radius);
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    margin-bottom: 30px;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 15px;
    font-weight: 800;
    font-size: 1.5em;
    color: var(--primary);
}

.view-toggle-btn {
    background: var(--elderly-view);
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 50px;
    font-size: 0.9em;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
}

.calendar-wrapper {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    padding: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.05);
}

.calendar-header h2 {
    font-size: 2em;
    font-weight: 800;
    margin-bottom: 25px;
}

.days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: var(--grid-gap);
}

.day-card {
    background: #f7fafc;
    border: 4px solid transparent;
    border-radius: var(--border-radius);
    padding: 15px;
    min-height: var(--min-box-height);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.day-number {
    font-weight: 800;
    font-size: 1.2em;
}

.event-sticker {
    background: var(--accent);
    padding: 6px 12px;
    border-radius: 30px;
    font-size: 0.75em;
    font-weight: bold;
    margin-top: 5px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

[data-theme="elderly"] .event-sticker {
    font-size: 0.85em;
    padding: 10px 16px;
}

    </style>

    <script>
        // ==========================================
// MODULE 1: FamilyDataEngine
// Responsibility: Parse CSV strings and query family events
// ==========================================
const FamilyDataEngine = {
    _records: [],

    MONTH_MAP: {
        'JAN': 0, 'FEB': 1, 'MAR': 2, 'APR': 3, 'MAY': 4, 'JUN': 5,
        'JUL': 6, 'AUG': 7, 'SEP': 8, 'OCT': 9, 'NOV': 10, 'DEC': 11
    },

    parseCSV(csvText) {
        if (!csvText) return [];
        const lines = csvText.split('\n');
        const parsedResults = [];

        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;

            // Split explicitly by comma boundaries
            const columns = line.split(',');
            if (columns.length < 2) continue;

            const nameToken = columns[0].trim();
            const dobToken = columns[1].trim();
            const dodToken = columns[2] ? columns[2].trim() : "";

            if (nameToken && dobToken) {
                parsedResults.push({
                    name: nameToken,
                    dob: this._parseGedcomDate(dobToken),
                    dod: dodToken ? this._parseGedcomDate(dodToken) : null
                });
            }
        }
        this._records = parsedResults;
        return this._records;
    },

    _parseGedcomDate(dateStr) {
        if (!dateStr) return null;
        const cleanStr = dateStr.trim().toUpperCase();
        
        // Match spaces or tabs separating day, month, and year tokens
        const parts = cleanStr.split(/\s+/);
        if (parts.length !== 3) return null;

        const day = parseInt(parts[0], 10);
        const monthStr = parts[1];
        const year = parseInt(parts[2], 10);
        const monthIndex = this.MONTH_MAP[monthStr];

        if (isNaN(day) || monthIndex === undefined || isNaN(year)) return null;
        return { day, month: monthIndex, year };
    },

    getEventsForDay(day, monthIndex, currentViewingYear) {
        const events = [];
        this._records.forEach(person => {
            if (person.dob && person.dob.day === day && person.dob.month === monthIndex) {
                if (person.dod) {
                    events.push({ type: 'MEMORIAL', label: `Remembrance: ${person.name}` });
                } else {
                    const age = currentViewingYear - person.dob.year;
                    events.push({ type: 'BIRTHDAY', label: `${person.name} (${age})` });
                }
            }
        });
        return events;
    }
};

let currentTheme = 'young';
function toggleViewMode() {
    const body = document.body;
    const txt = document.getElementById('toggleText');
    if (currentTheme === 'young') {
        body.setAttribute('data-theme', 'elderly');
        currentTheme = 'elderly';
        txt.innerText = "Switch to Standard Mode";
    } else {
        body.removeAttribute('data-theme');
        currentTheme = 'young';
        txt.innerText = "Switch to Grandparent Mode";
    }
}


        // ==========================================
// MODULE 3: CalendarGridRenderer
// Responsibility: Draw calendar dates and inject data events
// ==========================================
const CalendarGridRenderer = {
    // Start tracking the view state at a stable date (June 2026)
    currentViewingDate: new Date(2026, 5, 10),


    // ==========================================
// MODULE 3: CalendarGridRenderer
// Responsibility: Draw calendar dates and inject data events
// ==========================================
    // Start tracking the view state at a stable date (June 2026)
    currentViewingDate: new Date(2026, 5, 10),

    /**
     * Shifts the current calendar view forward or backward by a number of months
     * @param {number} direction (-1 for previous, 1 for next)
     */
    changeMonth(direction) {
        const currentMonth = this.currentViewingDate.getMonth();
        this.currentViewingDate.setMonth(currentMonth + direction);
        this.render(); // Re-trigger grid calculations and redraw the UI
    },

    /**
     * Main rendering loop to draw the grid and pull data events
     */
    render() {
        const gridElement = document.getElementById('daysGrid');
        const displayElement = document.getElementById('monthYearDisplay');
        
        if (!gridElement || !displayElement) return;

        // Clear any old calendar boxes before redrawing
        gridElement.innerHTML = '';

        const year = this.currentViewingDate.getFullYear();
        const month = this.currentViewingDate.getMonth();

        // 1. Update the Month/Year banner text
        const bannerOptions = { month: 'long', year: 'numeric' };
        displayElement.innerText = this.currentViewingDate.toLocaleDateString('en-US', bannerOptions);

        // 2. Calculate month grid metrics
        const firstDayDayOfWeek = new Date(year, month, 1).getDay();
        const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
        const totalDaysInPrevMonth = new Date(year, month, 0).getDate();

        // 3. Draw Grayed-Out Days from the Previous Month
        for (let x = firstDayDayOfWeek; x > 0; x--) {
            const dayNum = totalDaysInPrevMonth - x + 1;
            this._createDayCell(dayNum, true, month - 1, year, gridElement);
        }

        // 4. Draw Active Days for the Current Month
        for (let i = 1; i <= totalDaysInMonth; i++) {
            this._createDayCell(i, false, month, year, gridElement);
        }

        // 5. Pad the rest of the grid with Days from the Next Month
        const currentSlotsFilled = gridElement.children.length;
        const totalGridSlotsNeeded = currentSlotsFilled > 35 ? 42 : 35;
        const remainingSlots = totalGridSlotsNeeded - currentSlotsFilled;
        
        for (let z = 1; z <= remainingSlots; z++) {
            this._createDayCell(z, true, month + 1, year, gridElement);
        }
    },

    /**
     * Helper logic to build an individual date box
     * @private
     */
    _createDayCell(dayNum, isOutsideMonth, monthIndex, yearNum, container) {
        const card = document.createElement('div');
        card.classList.add('day-card');
        
        if (isOutsideMonth) {
            card.style.opacity = "0.3";
        }

        // Number Label
        const numLabel = document.createElement('span');
        numLabel.classList.add('day-number');
        numLabel.innerText = dayNum;
        card.appendChild(numLabel);

        // Event Sticker Container
        const stickerContainer = document.createElement('div');
        stickerContainer.style.marginTop = "10px";

        // Query our data engine for any family events matching this calendar box
        const matches = FamilyDataEngine.getEventsForDay(dayNum, monthIndex, yearNum);
        
        matches.forEach(event => {
            const sticker = document.createElement('div');
            card.style.backgroundColor = "var(--accent)"; // Color block day card highlight
            sticker.classList.add('event-sticker');
            sticker.innerText = event.label;
            stickerContainer.appendChild(sticker);
        });

        card.appendChild(stickerContainer);
        container.appendChild(card);
    }
};

// MODULE 4: UIManager
// Responsibility: Decode encrypted strings inside the browser
// ==========================================
const UIManager = {
    /**
     * Decodes the embedded data string using the password provided by the user.
     */
    _deobfuscateData(encodedStr, passwordKey) {
        try {
            // Decode Base64 string wrapper
            let text = decodeURIComponent(escape(atob(encodedStr)));
            let output = "";
            
            // Reversible XOR decoding calculation loop
            for (let i = 0; i < text.length; i++) {
                output += String.fromCharCode(text.charCodeAt(i) ^ passwordKey.charCodeAt(i % passwordKey.length));
            }
            return output;
        } catch (e) {
            return null; // Return null if decryption fails
        }
    }
};

// Responsibility: Assert logic correctness during runtimes
// ==========================================
const FamilyEngineTests = {
    runSuite() {
        console.group("🚀 Running FamilyDataEngine Verification Tests...");
        try {
            this.testCSVParser();
            this.testBirthdayAgeCalculation();
            this.testTrailingCommaResilience();
            console.log("✅ All data engine unit tests passed cleanly!");
        } catch (error) {
            console.error("❌ Test Suite Regression Detected:", error.message);
        }
        console.groupEnd();
    },

    assert(condition, message) {
        if (!condition) throw new Error(`Assertion Failed: ${message}`);
    },

    testCSVParser() {
        const testData = `Name,DOB,DOD\nxx xx,10 JUN 2003,\nzz zz,22 MAY 2006,`;
        const records = FamilyDataEngine.parseCSV(testData);
        this.assert(records.length === 2, "Should cleanly isolate two unique record rows.");
        this.assert(records[0].name === "xx xx", "Name extraction normalization mismatch.");
        this.assert(records[0].dob.month === 5, "June token matching index incorrect.");
    },

    testBirthdayAgeCalculation() {
        const testData = `Name,DOB,DOD\nyy yy,15 AUG 2008,`;
        FamilyDataEngine.parseCSV(testData);
        const events = FamilyDataEngine.getEventsForDay(15, 7, 2026);
        this.assert(events.length === 1, "Failed to match event output tracking indices.");
        this.assert(events[0].label.includes("(18)"), "Dynamic age calculator engine offset error.");
    },

    testTrailingCommaResilience() {
        const testData = `Name,DOB,DOD\nzz zz,22 MAY 2006,`;
        const records = FamilyDataEngine.parseCSV(testData);
        this.assert(records[0].name === "zz zz", "Failed to clear out whitespace blocks cleanly.");
        this.assert(records[0].dob.day === 22, "Failed to process days properly when row ends on trailing comma.");
    }
};
