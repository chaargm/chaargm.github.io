<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Interleaved History System</title>
    <style>
        
        :root { --bg: #090d16; --panel: #111827; --border: #1f2937; --text: #f3f4f6; --muted: #9ca3af; --pers: #fb923c; --world: #38bdf8; --ok: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; padding: 12px; }
        header, .box { background: var(--panel); padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
        label { font-size: 0.7rem; font-weight: bold; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 6px 0; }
        @media (min-width: 480px) { .grid { grid-template-columns: repeat(5, 1fr); } }
        .chk { display: flex; align-items: center; justify-content: center; background: var(--bg); border: 1px solid var(--border); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .chk input { display: none; }
        .chk.active { background: rgba(56, 189, 248, 0.15); border-color: var(--world); color: var(--world); }
        .chk.active.p-layer { background: rgba(251, 146, 60, 0.15); border-color: var(--pers); color: var(--pers); }
        .bar { display: flex; gap: 4px; margin-top: 4px; }
        .btn { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn.active { background: var(--ok); border-color: var(--ok); color: #000; }
        
        /* Master Layout Wrapper Supporting Vertically Centered Left Sidebar Year Bubble */
        .layout-wrapper { display: flex; gap: 8px; position: relative; }
        .year-sidebar { width: 55px; flex-shrink: 0; position: relative; }
        
        /* Pins the year bubble to the vertical center-left edge of the viewport screen */
        .sticky-year-bubble { position: sticky; top: 50%; transform: translateY(-50%); background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--ok); color: var(--ok); font-family: monospace; font-size: 0.85rem; font-weight: 800; padding: 6px 4px; border-radius: 4px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10; width: 100%; letter-spacing: -0.02em; }
        
        .feed { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; position: relative; flex-grow: 1; }
        .spine { position: absolute; left: 20px; top: 15px; bottom: 15px; width: 2px; background: var(--border); }
        .node { display: flex; margin-bottom: 14px; position: relative; z-index: 2; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin: 12px 0 0 4px; flex-shrink: 0; }
        .n-pers .dot { background: var(--pers); box-shadow: 0 0 6px var(--pers); }
        .n-world .dot { background: var(--world); box-shadow: 0 0 6px var(--world); }
        .n-bridge .dot { background: var(--ok); border: 2px solid var(--bg); }
        .card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-left: 14px; flex-grow: 1; }
        .n-pers .card { border-left: 3px solid var(--pers); }
        .n-world .card { border-left: 3px solid var(--world); }
        .n-bridge .card { border: 1px dashed var(--ok); background: transparent; padding: 6px 10px; }
        .meta { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; }
        .tag-p { color: var(--pers); } .tag-w { color: var(--world); } .tag-b { color: var(--ok); font-size: 0.7rem; }
        .txt { font-size: 0.85rem; color: #e5e7eb; line-height: 1.4; }
        .carousel-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; margin-top: 6px; }
        .carousel-card { flex: 0 0 85%; background: var(--panel); border: 1px solid var(--border); padding: 8px; border-radius: 4px; scroll-snap-align: start; border-top: 2px solid var(--world); }
        .carousel-meta { font-size: 0.7rem; font-weight: bold; color: var(--world); margin-bottom: 4px; display: flex; justify-content: space-between; }
        
        
        .lock-overlay { position: fixed; inset: 0; background: rgba(9, 13, 22, 0.96); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .lock-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .lock-input { background: #090d16; border: 1px solid #1f2937; color: #f3f4f6; padding: 12px; border-radius: 6px; width: 100%; font-size: 0.95rem; text-align: center; outline: none; margin: 14px 0; }
        .lock-btn { background: #fb923c; color: #000; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .unlock-trigger-bar { background: #1e293b; padding: 8px 12px; border-radius: 6px; text-align: center; margin-bottom: 12px; border: 1px solid #334155; font-size: 0.85rem; color: #fb923c; font-weight: bold; cursor: pointer; }
        
    </style>
</head>
<body>
    <div id="lockOverlay" class="lock-overlay">
        <div class="lock-card">
            <div style="font-size:2rem; margin-bottom:12px;">🔒</div>
            <h3 style="font-size:1.1rem; margin-bottom:6px;">Unlock Family Records</h3>
            <p style="font-size:0.8rem; color:#9ca3af;">Enter the master password secret key to decrypt and blend your ancestry data directly into the public timeline.</p>
            <input type="password" id="vaultPasswordInput" class="lock-input" placeholder="Password Key Token...">
            <button onclick="triggerManualAuth()" class="lock-btn">Decrypt & Interleave</button>
            <button onclick="document.getElementById('lockOverlay').style.display='none'" class="lock-btn" style="background:transparent; color:#9ca3af; margin-top:8px;">View Public History Only</button>
        </div>
    </div>

    <header>
        <div id="unlockReminderBtn" class="unlock-trigger-bar" onclick="document.getElementById('lockOverlay').style.display='flex'">🔐 Family Tree Vault Locked — Tap to Decrypt Data</div>
        <label>Active Context Layers</label>
        <div class="grid">
            <div class="chk" id="b-p" style="opacity:0.5; pointer-events:none;"><input type="checkbox" id="c-p">❤️ Family</div>
            <div class="chk active" id="b-gl"><input type="checkbox" id="c-gl" checked>🌐 Global</div>
            <div class="chk active" id="b-us"><input type="checkbox" id="c-us" checked>🇺🇸 USA</div>
            <div class="chk active" id="b-in"><input type="checkbox" id="c-in" checked>🇮🇳 India</div>
            <div class="chk active" id="b-ks"><input type="checkbox" id="c-ks" checked>🇸🇦 KSA</div>
        </div>
        <label>Historical Depth Resolution</label>
        <div class="bar" id="tBar">
            <button class="btn active" data-t="1">T1</button>
            <button class="btn active" data-t="2">T2</button>
            <button class="btn active" data-t="3">T3</button>
            <button class="btn active" data-t="4">T4</button>
            <button class="btn active" data-t="5">T5</button>
        </div>
    </header>
    
    <div class="layout-wrapper">
        <div class="year-sidebar">
            <div class="sticky-year-bubble" id="activeYearDisplay">----</div>
        </div>
        <div class="feed">
            <div class="spine"></div>
            <div id="stream"></div>
        </div>
    </div>

        let activeT = new Set([1, 2, 3, 4, 5]);
        let layers = { "Personal": false, "Global": true, "USA": true, "India": true, "Saudi Arabia": true };
        let personalData = [];

        function getVal(s) {
            const t = s.trim().split(" ");
            if (t.length === 3) {
                const m = { JAN:0, FEB:1, MAR:2, APR:3, MAY:4, JUN:5, JUL:6, AUG:7, SEP:8, OCT:9, NOV:10, DEC:11 };
                return new Date(parseInt(t[2]), m[t[1].toUpperCase()] || 0, parseInt(t[0])).getTime();
            }
            return new Date(parseInt(s), 0, 1).getTime();
        }

        function updateStickyYearTrack() {
            const nodes = document.querySelectorAll(".node");
            const bubble = document.getElementById("activeYearDisplay");
            if (!bubble || nodes.length === 0) return;
            
            let currentYear = bubble.innerText;
            const triggerLine = window.innerHeight * 0.50; 
            
            for (let i = 0; i < nodes.length; i++) {
                const rect = nodes[i].getBoundingClientRect();
                if (rect.top <= triggerLine) {
                    const yrAttr = nodes[i].getAttribute("data-year");
                    if (yrAttr) currentYear = yrAttr;
                } else {
                    break;
                }
            }
            if (bubble.innerText !== currentYear) bubble.innerText = currentYear;
        }

        async function decryptVaultEngine(password) {
            try {
                const binaryStr = atob(vaultPayload);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

                const salt = bytes.slice(0, 16);
                const iv = bytes.slice(16, 28);
                const encryptedData = bytes.slice(28);

                const encoder = new TextEncoder();
                const baseKey = await window.crypto.subtle.importKey(
                    "raw", encoder.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
                );

                const cryptoKey = await window.crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt: salt, iterations: 600000, hash: "SHA-256" },
                    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
                );

                const decryptedBuffer = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv }, cryptoKey, encryptedData
                );

                const decoder = new TextDecoder();
                personalData = JSON.parse(decoder.decode(decryptedBuffer));
                
                localStorage.setItem("family_timeline_vault_key", password);
                layers["Personal"] = true;
                
                // Adjust layout boundaries smoothly once decrypted
                document.getElementById("lockOverlay").style.display = "none";
                document.getElementById("unlockReminderBtn").style.display = "none";
                const pBtn = document.getElementById("b-p");
                pBtn.style.opacity = "1";
                pBtn.style.pointerEvents = "auto";
                pBtn.classList.add("active");
                document.getElementById("c-p").checked = true;
                
                render();
            } catch (err) {
                alert("❌ Access Denied: Invalid cryptographic key.");
                localStorage.removeItem("family_timeline_vault_key");
            }
        }

        function checkAuthLifecycle() {
            const savedKey = localStorage.getItem("family_timeline_vault_key");
            if (savedKey) decryptVaultEngine(savedKey);
        }

        function triggerManualAuth() {
            const pwd = document.getElementById("vaultPasswordInput").value.trim();
            if (pwd) decryptVaultEngine(pwd);
        }

        function render() {
            const div = document.getElementById("stream"); div.innerHTML = "";
            
            // Build dual track extraction
            const filteredWorld = publicData.filter(e => layers[e.scope] && activeT.has(e.tier));
            const filteredPersonal = layers["Personal"] ? personalData : [];
            
            let combined = [...filteredWorld, ...filteredPersonal];
            combined.sort((a, b) => getVal(a.date) - getVal(b.date));

            let finalNodes = [];
            let yearBuckets = {};

            combined.forEach(e => {
                if (e.type === "world") {
                    if (!yearBuckets[e.year]) yearBuckets[e.year] = [];
                    yearBuckets[e.year].push(e);
                } else {
                    finalNodes.push(e);
                }
            });

            Object.keys(yearBuckets).forEach(y => {
                const bucket = yearBuckets[y];
                if (bucket.length >= 4) {
                    finalNodes.push({ year: parseInt(y), date: y, type: "cluster", events: bucket });
                } else {
                    bucket.forEach(e => finalNodes.push(e));
                }
            });

            finalNodes.sort((a, b) => a.year - b.year);

            if (finalNodes.length > 0 && document.getElementById("activeYearDisplay").innerText === "----") {
                document.getElementById("activeYearDisplay").innerText = finalNodes[0].year;
            }

            for (let i = 0; i < finalNodes.length; i++) {
                const current = finalNodes[i];
                if (i > 0 && (current.year - finalNodes[i-1].year) > 4) {
                    const gap = current.year - finalNodes[i-1].year;
                    const bridge = document.createElement("div");
                    bridge.className = "node n-bridge";
                    bridge.setAttribute("data-year", current.year);
                    bridge.innerHTML = `<div class="dot"></div><div class="card"><div class="meta"><span class="tag-b">⏩ GAP COMPRESSION BRIDGE</span></div><div class="txt" style="color:var(--ok); font-size:0.75rem; font-weight:bold;">${gap} Years Passed Chronologically</div></div>`;
                    div.appendChild(bridge);
                }

                const el = document.createElement("div");
                el.className = `node n-${current.type === 'cluster' ? 'world' : current.type}`;
                el.setAttribute("data-year", current.year);
                
                if (current.type === "cluster") {
                    let innerCards = "";
                    current.events.forEach(ev => {
                        innerCards += `<div class="carousel-card"><div class="carousel-meta"><span>${ev.lbl}</span><span>${ev.date}</span></div><div class="txt">${ev.text}</div></div>`;
                    });
                    el.innerHTML = `
                        <div class="dot"></div>
                        <div class="card">
                            <div class="meta"><span class="tag-w">📦 CLUSTERED ERA — ${current.year}</span><span>${current.events.length} Events</span></div>
                            <div class="carousel-container">${innerCards}</div>
                        </div>`;
                } else {
                    el.innerHTML = `<div class="dot"></div><div class="card"><div class="meta"><span class="${current.type==='pers'?'tag-p':'tag-w'}">${current.lbl}</span><span>${current.date}</span></div><div class="txt">${current.text}</div></div>`;
                }
                div.appendChild(el);
            }
            updateStickyYearTrack();
        }

        function bind(bId, cId, key) {
            document.getElementById(bId).addEventListener("click", function() {
                if (key === "Personal" && !layers["Personal"]) return;
                const c = document.getElementById(cId); c.checked = !c.checked;
                layers[key] = c.checked; this.classList.toggle("active", c.checked); render();
            });
        }
        bind("b-gl", "c-gl", "Global"); bind("b-us", "c-us", "USA"); bind("b-in", "c-in", "India"); bind("b-ks", "c-ks", "Saudi Arabia");
        
        // Explicitly bind the family checkbox layer independently
        document.getElementById("b-p").addEventListener("click", function() {
            if (!layers["Personal"]) return;
            const c = document.getElementById("c-p"); c.checked = !c.checked;
            layers["Personal"] = c.checked; this.classList.toggle("active", c.checked); render();
        });

        document.getElementById("tBar").addEventListener("click", (e) => {
            if (!e.target.classList.contains("btn")) return;
            const t = parseInt(e.target.dataset.t);
            if (activeT.has(t)) { if (activeT.size > 1) activeT.delete(t); } else { activeT.add(t); }
            e.target.classList.toggle("active"); render();
        });

        document.getElementById("vaultPasswordInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") triggerManualAuth();
        });

        window.addEventListener("scroll", updateStickyYearTrack, { passive: true });
        render();
        checkAuthLifecycle();
        
    </script>
</body>
</html>
